<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b3d91">
  <title>THE GOONIES · Practice Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/app.css">
</head>
<body>
  <div class="bg-blobs" aria-hidden="true"></div>

  <header class="hero">
    <div class="hero-badge">⚾ 8U Coach Pitch</div>
    <h1 class="hero-title">
      <span class="hero-team">THE GOONIES</span>
    </h1>
    <p class="hero-tagline">Goonies never say die!</p>
    <p class="hero-sub">Cedar Park Youth League · Practice with Dad</p>
    <div class="star-bank" id="star-bank" title="Stars you earned">
      <span class="star-bank-icon">⭐</span>
      <span id="star-count">0</span>
      <span class="star-bank-label">stars</span>
    </div>
  </header>

  <main class="wrap">
    <section class="calendar-section" aria-label="Practice calendar">
      <div class="section-head">
        <h2>📅 This Week</h2>
        <div class="week-nav">
          <button type="button" class="nav-btn" id="prev-week" aria-label="Previous week">‹</button>
          <span class="week-label" id="week-label">Week</span>
          <button type="button" class="nav-btn" id="next-week" aria-label="Next week">›</button>
        </div>
      </div>
      <p class="week-note" id="week-note" hidden></p>
      <div class="calendar" id="calendar" role="tablist" aria-label="Days of the week"></div>
    </section>

    <section class="day-panel" id="day-panel" aria-live="polite">
      <div class="day-hero" id="day-hero"></div>
      <div class="drills" id="drills"></div>
      <div class="videos-block" id="videos-block" hidden>
        <h3 class="videos-title">🎬 Watch with Dad</h3>
        <div class="videos" id="videos"></div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <p>Built for a Goonie · Tap <strong>I did it!</strong> to earn stars</p>
    <p><a class="coach-link" href="https://github.com/GrrHero/youth-sports-coaching" target="_blank" rel="noopener">Coach Dad notes</a></p>
  </footer>

  <script src="assets/js/app.js" defer></script>
</body>
</html>
